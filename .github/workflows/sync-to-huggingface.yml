name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-huggingface-space
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[app,dev]'

      - name: Validate app
        run: |
          python -m ruff check .
          python -m pytest -q

      - name: Prepare Hugging Face Space README metadata
        run: |
          cp README.md README.github.md
          cat > README.md <<'EOF'
          ---
          title: Lingappan MLI Analyzer
          emoji: 🫁
          colorFrom: blue
          colorTo: teal
          sdk: gradio
          sdk_version: 6.14.0
          app_file: app.py
          pinned: false
          license: mit
          ---
          EOF
          cat README.github.md >> README.md

      - name: Sync repository to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: LingappanLab/LingappanMLI
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: gradio
